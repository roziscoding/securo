name: Preview Docker images

on:
  pull_request_target:
    types: [labeled]

# This workflow is intentionally kept on the protected default branch. It uses
# the trusted workflow definition while building the exact commit that was
# explicitly labeled by the repository owner.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.image }} preview
    if: >-
      github.event.label.name == 'preview-docker' &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner &&
      github.event.sender.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: securo-backend-preview
            context: backend
            dockerfile: backend/Dockerfile
            build_arg_name: ''
          - image: securo-frontend-preview
            context: frontend
            dockerfile: frontend/Dockerfile
            build_arg_name: VITE_APP_VERSION

    steps:
      - name: Verify the labeled PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$CURRENT_HEAD" = "$EXPECTED_HEAD"
          gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --jq '.[].name' | grep -Fxq preview-docker

      - name: Check out the exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Derive unique preview identity
        id: preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}"
          TAG="pr-${PR_NUMBER}-${HEAD_SHA}-run-${RUN_ID}-${RUN_ATTEMPT}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reference=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish preview
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.preview.outputs.reference }}
          build-args: ${{ matrix.build_arg_name && format('{0}={1}', matrix.build_arg_name, steps.preview.outputs.tag) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.version=${{ steps.preview.outputs.tag }}
          cache-from: type=gha,scope=preview-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.image }}
          provenance: mode=max
          sbom: true

      - name: Attest the published manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.preview.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish the digest-pinned reference
        run: |
          {
            echo '### `${{ matrix.image }}`'
            echo
            echo '`${{ steps.preview.outputs.reference }}@${{ steps.build.outputs.digest }}`'
            echo
            echo 'The digest above is the immutable deployment identity.'
            echo 'To build a newer commit, remove and reapply `preview-docker`.'
          } >> "$GITHUB_STEP_SUMMARY"
